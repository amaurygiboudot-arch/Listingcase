plugins {
    id 'com.android.application'
}

android {
    namespace 'com.humanpartner'
    compileSdk 35

    defaultConfig {
        applicationId 'com.humanpartner'
        minSdk 26
        targetSdk 35
        versionCode 6
        versionName '0.1.5'
    }

    buildTypes {
        debug {
            debuggable true
        }
        release {
            minifyEnabled false
        }
    }
}
