name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Node 22 checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Show versions
        run: |
          node --version
          npm --version

      - name: Syntax checks
        run: npm run check

      - name: Start application
        run: |
          node server.js > server.log 2>&1 &
          echo $! > server.pid

      - name: Wait for API
        shell: bash
        run: |
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8787/api/health > health.json; then
              cat health.json
              exit 0
            fi
            sleep 1
          done
          cat server.log || true
          exit 1

      - name: Validate health response
        run: |
          node -e "const fs=require('fs');const d=JSON.parse(fs.readFileSync('health.json','utf8'));if(d.ok!==true)process.exit(1);if(d.library?.total!==10000)process.exit(2);console.log('Health OK - library:',d.library.total)"

      - name: Stop application
        if: always()
        run: |
          if [ -f server.pid ]; then kill $(cat server.pid) || true; fi

      - name: Prepare downloadable artifact
        if: always()
        shell: bash
        run: |
          mkdir -p artifact
          cp index.html styles.css app.js server.js package.json README.md artifact/
          cp -r lib artifact/lib
          cp -r .github artifact/.github
          cp server.log artifact/server.log 2>/dev/null || true
          cp health.json artifact/health.json 2>/dev/null || true
          tar -czf human-partner-${{ github.sha }}.tar.gz artifact

      - name: Upload project artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: human-partner-${{ github.run_number }}
          path: |
            human-partner-${{ github.sha }}.tar.gz
            artifact/
          if-no-files-found: error
          retention-days: 14
