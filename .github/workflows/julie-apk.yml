          f=Path('android/app/build.gradle')
          s=f.read_text()
          a="applicationId 'com.humanpartner'"
          assert s.count(a)==1, 'Ancien identifiant Android introuvable : arrêt prudent'
          s=s.replace(a,"applicationId 'com.julie.preview'")
          s=s.replace("versionCode 9","versionCode 10")
          s=s.replace("versionName '0.1.8'","versionName '0.1.0-julie-preview'")
          f.write_text(s)
          print('ApplicationId indépendant : com.julie.preview')
          PYPATCH

      - name: Compiler l'APK Android hors ligne
        shell: bash
        working-directory: android
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Vérifier l'APK compilée
        shell: bash
        run: |
          set -euo pipefail
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -l "$APK" | grep -q 'assets/julie/index.html'
          unzip -l "$APK" | grep -q 'assets/julie/app.js'
          unzip -l "$APK" | grep -q 'classes.dex'
          mkdir -p julie-apk-artifact
          cp "$APK" julie-apk-artifact/JULIE-3D-Preview-debug.apk
          cp julie-preview/README.md julie-apk-artifact/NOTICE-LISEZ-MOI.md
          sha256sum julie-apk-artifact/JULIE-3D-Preview-debug.apk > julie-apk-artifact/SHA256SUMS.txt
          ls -lh julie-apk-artifact

      - name: Publier l'APK téléchargeable
        uses: actions/upload-artifact@v4
        with:
          name: Julie-3D-APK
          path: julie-apk-artifact/
          retention-days: 14
          if-no-files-found: error

      - name: Conserver le code source Julie dans julie-v1 (après compilation)
        shell: bash
        run: |
          set -euo pipefail
          git add julie-preview/www/index.html julie-preview/www/style.css julie-preview/www/app.mjs \
            julie-preview/android/MainActivity.java julie-preview/android/AndroidManifest.xml \
            julie-preview/android/julie_icon.xml julie-preview/README.md
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'Sources déjà conservées'
            exit 0
          fi
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m 'feat(julie): version Android 3D hors ligne et autonome'
          git push origin HEAD:julie-v1
