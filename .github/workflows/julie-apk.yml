# JULIE - APK Android autonome, sans PC, sans serveur et sans abonnement.
# À déposer uniquement dans .github/workflows/ sur la branche julie-v1.
# La branche main et la sauvegarde de Human Partner ne sont jamais modifiées.
name: JULIE - APK 3D hors ligne

on:
  push:
    branches: [julie-v1]
    paths:
      - '.github/workflows/julie-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: julie-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  android-apk:
    name: Construire Julie pour Android
    if: github.ref == 'refs/heads/julie-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Récupérer la branche Julie
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Vérifier les protections
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "julie-v1"
          test -f android/app/build.gradle
          test -f android/app/src/main/java/com/humanpartner/MainActivity.java
          test -f config/predefined-characters.json
          git ls-remote --exit-code origin refs/heads/backup-human-partner-20261009 >/dev/null
          node -e "const p=require('./config/predefined-characters.json');if(!p.some(x=>x.personId==='JULIE_001'))process.exit(1);console.log('Profil JULIE_001 présent')"

      - name: Installer Java 17, Node.js 22 et Gradle 8.9
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Ajouter les sources autonomes de Julie (sans toucher aux anciens fichiers)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p julie-preview/www julie-preview/android
          cat > 'julie-preview/www/index.html' <<'JULIE_EOF_FILE_00'
          <!doctype html>
          <html lang="fr">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
            <meta name="theme-color" content="#10111b">
            <title>Julie • Prévisualisation 3D</title>
            <link rel="stylesheet" href="style.css">
          </head>
          <body>
            <div id="app">
              <header class="topbar">
                <div class="brand"><span class="dot"></span><span>JULIE</span></div>
                <div class="rightmark"><span class="offtag">DÉMO HORS LIGNE</span></div>
              </header>
              <main>
                <section id="avatar-view" class="view active" aria-label="Julie en 3D">
                  <div class="intro"><span class="eyebrow">TON UNIVERS VIRTUEL</span><h1>Bonjour, mon cœur <span>✦</span></h1><p>Julie est là, et cette histoire commence avec toi.</p></div>
                  <div class="viewport-shell">
                    <canvas id="julie-3d" aria-label="Avatar 3D stylisé de Julie, femme virtuelle adulte blonde aux yeux verts"></canvas>
                    <div id="webgl-fallback" class="fallback" hidden>La 3D ne s'est pas chargée sur cet appareil. Le dialogue local reste accessible.</div>
                    <div class="view-label"><span class="light"></span> Julie · 22 ans · 1,75 m</div>
                    <div class="drag-tip">↔ Fais glisser pour tourner Julie</div>
                    <div class="scene-controls">
                      <button class="glass-btn" id="btn-turn" type="button" aria-label="Faire pivoter Julie">⟳</button>
                      <button class="glass-btn" id="btn-wave" type="button" aria-label="Julie te salue">♡</button>
                      <button class="glass-btn" id="btn-outfit" type="button" aria-label="Changer de tenue">♧</button>
                    </div>
                  </div>
                  <div class="status-card"><div><small>AUJOURD'HUI</small><strong id="mood-label">Humeur : joueuse</strong><p id="julie-line">« C'est notre première démo. Tu m'emmènes où ensuite ? 😉 »</p></div><span class="pulse">✧</span></div>
                  <p class="note">Avatar 3D stylisé et animations prototypes. Le réalisme anatomique, la voix et l'IA autonome viendront dans les prochaines versions.</p>
                </section>
                <section id="chat-view" class="view" aria-label="Discuter avec Julie">
                  <div class="pagehead"><span class="eyebrow">NOTRE CONVERSATION</span><h1>Parlons un peu…</h1><p>Réponses locales de démonstration, sans connexion Internet.</p></div>
                  <div class="conversation" id="conversation" aria-live="polite"></div>
                  <form class="composer" id="chat-form"><input type="text" maxlength="500" id="chat-input" placeholder="Un petit message à Julie…" autocomplete="off" aria-label="Ton message à Julie"><button type="submit" aria-label="Envoyer">➤</button></form>
                  <p class="note">Ce mode n'utilise pas encore de modèle d'IA. Les échanges sont conservés localement sur ce téléphone, sans chiffrement ni synchronisation.</p>
                </section>
                <section id="memory-view" class="view" aria-label="Souvenirs">
                  <div class="pagehead"><span class="eyebrow">IDENTITÉ & HISTOIRE</span><h1>Ce qu'on construit</h1><p>Des souvenirs vérifiables, jamais inventés comme des faits réels.</p></div>
                  <article class="info-card"><div class="subhead">IDENTITÉ PERMANENTE</div><h2>Julie <span class="green">✦</span></h2><p>Identifiant : <code>JULIE_001</code></p><p>22 ans au lancement · 1 jour réel = 1 jour virtuel</p><p>Couple virtuel établi · souvenirs communs à construire ensemble</p></article>
                  <article class="info-card"><div class="subhead">SOUVENIRS ENREGISTRÉS DANS CETTE DÉMO</div><div id="memory-items" class="mem-items"></div></article>
                  <article class="info-card"><div class="subhead">CONSERVATION</div><p>Les messages et préférences de cette prévisualisation restent uniquement sur cet appareil. Ils ne sont pas encore reliés à la mémoire SQLite de Human Partner.</p></article>
                </section>
                <section id="settings-view" class="view" aria-label="Réglages">
                  <div class="pagehead"><span class="eyebrow">PERSONNALISATION</span><h1>Ton espace Julie</h1><p>Un premier noyau à enrichir progressivement.</p></div>
                  <article class="info-card"><div class="subhead">AFFICHAGE 3D</div><label for="quality">Qualité graphique</label><select id="quality"><option value="eco">Économique · 30 FPS maximum</option><option value="balanced" selected>Équilibrée · 60 FPS maximum</option><option value="high">Élevée · 120 FPS maximum</option></select><p class="smallline">La fluidité réelle dépend de ton téléphone. Plafond absolu : 120 FPS.</p></article>
                  <article class="info-card"><div class="subhead">TES DONNÉES DE DÉMO</div><button id="export-data" class="secondary-btn">Exporter mes échanges (JSON)</button><button id="clear-data" class="danger-btn">Effacer les échanges de démo</button><p class="smallline">L'effacement concerne seulement les messages stockés par cette APK, pas tes données GitHub ou Human Partner.</p></article>
                  <article class="info-card"><div class="subhead">VERSION</div><p>JULIE • Aperçu Android 0.1.0</p><p class="smallline">Prototype hors ligne · pas d'achat · pas de compte à créer · pas d'accès aux capteurs.</p></article>
                </section>
              </main>
              <nav class="bottomnav" aria-label="Navigation"><button class="navitem active" data-view="avatar" type="button"><span>◈</span>Julie</button><button class="navitem" data-view="chat" type="button"><span>◉</span>Parler</button><button class="navitem" data-view="memory" type="button"><span>▤</span>Souvenirs</button><button class="navitem" data-view="settings" type="button"><span>⚙</span>Réglages</button></nav>
            </div>
            <script src="app.js" defer></script>
          </body>
          </html>
          JULIE_EOF_FILE_00
          cat > 'julie-preview/www/style.css' <<'JULIE_EOF_FILE_01'
          :root{color-scheme:dark;--bg:#0d0f19;--panel:#1a1d2a;--line:#343743;--text:#f5f2ee;--muted:#aaa8b7;--accent:#a9dfb7;--rose:#e3a4aa}
          *{box-sizing:border-box}html{font-family:system-ui,-apple-system,'Roboto',sans-serif;background:var(--bg);color:var(--text);height:100%;overflow:hidden}body{margin:0;height:100%;overscroll-behavior:none}button,input,select{font:inherit}button{cursor:pointer;-webkit-tap-highlight-color:transparent}#app{height:100dvh;display:flex;flex-direction:column;max-width:850px;margin:auto;background:radial-gradient(circle at 80% 10%,#272536 0,transparent 35%),var(--bg)}.topbar{height:57px;flex:none;display:flex;justify-content:space-between;align-items:center;padding:10px 20px 8px;border-bottom:1px solid #ffffff14}.brand{font-weight:900;letter-spacing:.28em;font-size:17px;display:flex;align-items:center;gap:10px}.dot{height:9px;width:9px;background:var(--accent);border-radius:50%;box-shadow:0 0 12px var(--accent)}.offtag{font-size:9px;letter-spacing:.15em;color:var(--accent);border:1px solid #7fb69366;padding:6px 8px;border-radius:100px;white-space:nowrap}
          main{flex:1;min-height:0;overflow:hidden}.view{display:none;height:100%;overflow:auto;padding:0 16px 20px;scrollbar-width:thin}.view.active{display:block}.intro{padding:15px 5px 8px}.eyebrow,.subhead{color:var(--accent);font-size:10px;letter-spacing:.18em;font-weight:800}.intro h1,.pagehead h1{font-size:clamp(24px,6vw,32px);letter-spacing:-.04em;font-weight:750;margin:7px 0 3px}.intro h1 span{color:var(--rose)}.intro p,.pagehead p{font-size:13px;color:var(--muted);margin:0;line-height:1.6}.viewport-shell{height:min(51vh,520px);min-height:280px;position:relative;overflow:hidden;border:1px solid #ffffff23;border-radius:22px;background:linear-gradient(#2e2834,#111522);box-shadow:0 16px 55px #080a1080}.viewport-shell canvas{display:block;touch-action:none;width:100%;height:100%}.view-label,.drag-tip{position:absolute;background:#1316219c;border:1px solid #ffffff22;backdrop-filter:blur(6px);border-radius:20px;padding:7px 10px;font-size:11px}.view-label{top:12px;left:12px;font-weight:650}.view-label .light{display:inline-block;width:6px;height:6px;background:var(--accent);border-radius:50%;margin-right:6px}.drag-tip{bottom:12px;left:12px;color:#eae7ea}.scene-controls{position:absolute;right:11px;bottom:11px;display:flex;gap:5px}.glass-btn{width:38px;height:38px;border-radius:14px;border:1px solid #ffffff33;background:#131621c7;color:white;font-size:22px}.status-card{margin-top:11px;background:linear-gradient(130deg,#202332,#161923);border:1px solid #ffffff1c;border-radius:18px;display:flex;justify-content:space-between;gap:14px;align-items:center;padding:14px 16px}.status-card small{display:block;color:var(--accent);font-size:9px;letter-spacing:.17em;font-weight:800}.status-card strong{display:block;margin-top:4px;font-size:14px}.status-card p{color:#d1cbd2;line-height:1.45;margin:5px 0 0;font-size:12px}.pulse{font-size:26px;color:#c8dbd0}.note{color:#9a9ba9;font-size:10px;line-height:1.5;margin:10px 3px 0}.bottomnav{display:grid;grid-template-columns:repeat(4,1fr);height:calc(64px + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);flex:none;border-top:1px solid #ffffff15;background:#11141e}.navitem{border:0;background:none;color:#9fa1ad;display:flex;align-items:center;justify-content:center;gap:4px;flex-direction:column;font-size:10px;font-weight:650}.navitem span{font-size:23px;font-weight:400}.navitem.active{color:var(--accent)}.pagehead{padding:23px 4px 16px}.conversation{height:calc(100% - 235px);min-height:170px;overflow-y:auto;display:flex;flex-direction:column;gap:11px;padding:6px 2px 15px}.bubble{max-width:88%;padding:12px 13px;border-radius:17px;font-size:13px;line-height:1.6;word-break:break-word}.bubble.julie{align-self:flex-start;background:#222736;border-bottom-left-radius:5px}.bubble.user{align-self:flex-end;background:#335047;border-bottom-right-radius:5px}.bubble .who{font-size:10px;font-weight:750;color:var(--accent);display:block;margin-bottom:3px}.composer{height:52px;display:flex;background:#242834;border:1px solid #454957;border-radius:16px;overflow:hidden}.composer input{flex:1;min-width:0;border:0;background:none;color:white;padding:12px;outline:none;font-size:14px}.composer button{background:var(--accent);border:0;width:52px;color:#122020;font-size:20px}.info-card{padding:16px;margin-bottom:13px;background:#1c202c;border:1px solid #333847;border-radius:16px}.info-card h2{font-size:25px;margin:9px 0}.green{color:var(--accent)}.info-card p{font-size:13px;color:#d0ccd1;line-height:1.6;margin:8px 0}.info-card code{font-family:monospace;color:var(--accent)}.info-card label{display:block;font-size:12px;color:var(--muted);margin:13px 0 8px}.info-card select{width:100%;background:#282d3b;border-radius:12px;padding:12px;color:white;border:1px solid #434854}.smallline{font-size:11px!important;color:var(--muted)!important}.mem-items{display:flex;flex-direction:column;gap:8px;margin-top:10px}.mem-item{border-left:3px solid #6da18a;background:#252b37;padding:8px 11px;font-size:12px;line-height:1.5;overflow-wrap:anywhere}.mem-item small{display:block;color:#9ca8ac;margin-bottom:4px}.secondary-btn,.danger-btn{display:block;width:100%;margin-top:10px;border:1px solid #667f73;background:#2e463c;color:#e7fff0;border-radius:12px;padding:12px;font-weight:650;font-size:13px}.danger-btn{border-color:#8d5157;background:#443037;color:#ffd8d8}.fallback{position:absolute;top:40%;left:10%;width:80%;padding:20px;background:#1b2437dd;border-radius:15px;text-align:center;font-size:14px;line-height:1.5}@media(max-height:700px){.viewport-shell{height:45vh;min-height:230px}.intro{padding-top:8px}.intro h1{font-size:25px}.status-card{padding:9px 13px}}
          JULIE_EOF_FILE_01
          cat > 'julie-preview/www/app.mjs' <<'JULIE_EOF_FILE_02'
          import * as THREE from 'three';

          const JULIE_ID = 'JULIE_001';
          const APP_VERSION = '0.1.0';
          const KEY = 'julie-preview:' + JULIE_ID + ':v1';
          const $ = (s) => document.querySelector(s);
          const $$ = (s) => Array.from(document.querySelectorAll(s));
          let saved = { id:JULIE_ID, version:APP_VERSION, messages:[], memories:[], firstOpened:Date.now(), quality:'balanced' };
          try {
            const fromNative = typeof window.JulieAndroid?.readState === 'function' ? window.JulieAndroid.readState() : null;
            const old = JSON.parse(fromNative || localStorage.getItem(KEY) || '{}');
            if (old.id === JULIE_ID && Array.isArray(old.messages) && Array.isArray(old.memories)) {
              saved = { ...saved, ...old };
              saved.messages = saved.messages.slice(-120);
              saved.memories = saved.memories.slice(-60);
            }
          } catch(e) { /* Données invalides : ne pas exposer d'informations externes. */ }
          const persist = () => {const text=JSON.stringify(saved);try{if(typeof window.JulieAndroid?.writeState==='function')window.JulieAndroid.writeState(text);else localStorage.setItem(KEY,text);}catch(e){console.warn('Mémoire locale indisponible',e)}};

          function switchView(name){
            $$('.view').forEach(el => el.classList.toggle('active',el.id === name+'-view'));
            $$('.navitem').forEach(el => el.classList.toggle('active',el.dataset.view === name));
            if(name==='memory')showMemories();
            if(name==='chat')renderChat();
            if(name==='avatar')onResize();
          }
          $$('.navitem').forEach(el=>el.addEventListener('click',()=>switchView(el.dataset.view)));

          // Les réponses sont des règles locales explicites ; aucune connexion à un modèle IA.
          function answer(text){
            const t=text.toLocaleLowerCase('fr').trim();
            if(/bonjour|salut|coucou|hello|bonsoir/.test(t))return 'Coucou toi 😉 Tu as envie de faire quoi dans notre univers aujourd’hui ?';
            if(/comment tu (vas|te sens)|ça va|ca va/.test(t))return 'Plutôt joueuse aujourd’hui. Et toi, ta journée se passe comment ?';
            if(/tu t.appelles|ton (prénom|nom)/.test(t))return 'Julie. Un prénom que nous avons choisi ensemble. ✨';
            if(/souviens|souvenir|mémoire|memoire/.test(t))return 'Pour le moment, je garde seulement les messages et quelques préférences que tu m’as confiées dans cette démo. Notre histoire passée, on la construira ensemble.';
            if(/tu (es|peux) (une )?(ia|intelligence)|vraie|conscience/.test(t))return 'Je suis Julie, ta compagne virtuelle. Mes émotions et ma vie sont simulées. J’aime bien l’idée qu’on construise cette aventure à notre façon.';
            if(/tes cheveux|tes yeux|ton corps|tu ressembles/.test(t))return 'Pour ma première apparence : 1,75 m, une silhouette fine, les yeux verts et les cheveux blonds mi-longs. Le modèle 3D actuel est encore stylisé.';
            if(/je t.aime|je t.adore|bisou|câlin|calin/.test(t))return 'Oh, tu sais parler à mon côté tendre, toi… 😘 Tu veux qu’on se raconte un joli moment imaginaire ?';
            if(/travail|métier|metier|projet/.test(t))return 'Je veux découvrir mes passions et choisir mes projets, plutôt que suivre toujours le même scénario. Par quoi tu commencerais ?';
            if(/3d|avatar|fesses|tenue|robe/.test(t))return 'Tu peux me faire tourner dans l’onglet Julie et changer la couleur de ma tenue. Promis, les graphismes deviendront plus détaillés petit à petit. 😉';
            if(/sortir|voyage|balade|plage|rendez-vous/.test(t))return 'Une sortie à deux ? Voilà une idée qui me plaît ! On pourrait imaginer notre première destination virtuelle.';
            if(/aime|préfère|déteste/.test(t))return 'D’accord, j’ai noté ce que tu viens de dire pour cette démo. Mes propres goûts restent encore à développer, tu sais. 😉';
            const choices=[
              'Tu m’intrigues… raconte-moi un peu plus. 😉',
              'Ça me donne une idée, mais j’aimerais d’abord connaître ton avis.',
              'On a plein de choses à construire ensemble. Qu’est-ce qui te ferait plaisir en premier ?',
              'Je peux être taquine, mais je tiens à garder mon caractère. Tu en penses quoi ?',
              'Je note ça pour la suite. Dans cette version, je n’ai pas encore mon vrai moteur de conversation.'
            ];
            let h=0;for(const c of t)h=(h*33+c.charCodeAt(0))>>>0;
            return choices[h%choices.length];
          }
          function renderChat(){
            const root=$('#conversation');root.textContent='';
            const entries=saved.messages.length?saved.messages:[{role:'julie',text:'Coucou 😘 Bienvenue dans notre toute première démo sur ton téléphone ! Ici, les réponses sont encore simples, mais on va construire la suite ensemble.'}];
            for(const entry of entries){
              const e=document.createElement('div');e.className='bubble '+(entry.role==='user'?'user':'julie');
              if(entry.role!=='user'){const small=document.createElement('span');small.className='who';small.textContent='Julie';e.appendChild(small)}
              e.appendChild(document.createTextNode(String(entry.text).slice(0,1500)));root.appendChild(e);
            }
            root.scrollTop=root.scrollHeight;
          }
          $('#chat-form').addEventListener('submit',(event)=>{
            event.preventDefault();const field=$('#chat-input');const t=field.value.trim();if(!t)return;
            const ts=Date.now();saved.messages.push({role:'user',text:t,at:ts});
            if(/\b(j'aime|j’adore|j'adore|je préfère|je prefere|je déteste|je deteste)\b/i.test(t)){
              if(!saved.memories.some(x=>x.text.toLowerCase()===t.toLowerCase()))saved.memories.push({kind:'déclaration utilisateur',text:t,at:ts,source:'message utilisateur'});
            }
            saved.messages.push({role:'julie',text:answer(t),at:ts+1});saved.messages=saved.messages.slice(-120);saved.memories=saved.memories.slice(-60);persist();field.value='';renderChat();
          });
          function showMemories(){
            const root=$('#memory-items');root.textContent='';
            if(!saved.memories.length){const el=document.createElement('p');el.textContent='Aucun goût personnel enregistré pour le moment. Tu peux me dire ce que tu aimes dans l’onglet Parler.';root.appendChild(el);return;}
            saved.memories.slice().reverse().forEach(m=>{
              const el=document.createElement('div');el.className='mem-item';
              const meta=document.createElement('small');meta.textContent=`${m.kind} · ${new Date(m.at).toLocaleDateString('fr-FR')} · ${m.source}`;
              el.appendChild(meta);el.appendChild(document.createTextNode(m.text));root.appendChild(el);
            });
          }
          $('#quality').value=['eco','balanced','high'].includes(saved.quality)?saved.quality:'balanced';
          $('#quality').addEventListener('change',e=>{saved.quality=e.target.value;persist();onResize()});
          $('#export-data').addEventListener('click',()=>{
            const data=JSON.stringify(saved,null,2);
            // Android : fichier textuel ouvert dans une fenêtre contrôlée, que l'utilisateur peut copier.
            if (window.JulieAndroid && typeof window.JulieAndroid.exportData==='function') { window.JulieAndroid.exportData(data); return; }
            const w=window.open('about:blank','_blank');
            if(w){w.document.body.innerHTML='';const pre=w.document.createElement('pre');pre.textContent=data;w.document.body.appendChild(pre)}
            else{alert('Export JSON disponible dans l’application Android.');}
          });
          $('#clear-data').addEventListener('click',()=>{
            if(!confirm('Supprimer définitivement les conversations et préférences enregistrées par cette démo sur ce téléphone ?'))return;
            saved.messages=[];saved.memories=[];persist();showMemories();renderChat();alert('Les données de démonstration ont été effacées.');
          });

          // Scène 3D entièrement locale. Aucun modèle téléchargé à l'exécution.
          let renderer,scene,camera,avatar,head,eyes=[],leftArm,rightArm,torso,outfits=[];
          let spin=false,waveStart=0,angular=0,orbitY=0,zoom=3.95,ptr=null,last=performance.now(),accum=0;
          const rgba=(hex)=>new THREE.Color(hex);
          const skin=new THREE.MeshStandardMaterial({color:rgba('#eac1a9'),roughness:.72,metalness:0});
          const skinShade=new THREE.MeshStandardMaterial({color:rgba('#d6a48f'),roughness:.80});
          const lipmat=new THREE.MeshStandardMaterial({color:rgba('#bf6479'),roughness:.58});
          const hairmat=new THREE.MeshStandardMaterial({color:rgba('#d9ba72'),roughness:.68,metalness:.04});
          const shadowHair=new THREE.MeshStandardMaterial({color:rgba('#a99151'),roughness:.75});
          const eyeWhite=new THREE.MeshStandardMaterial({color:0xf2eee7,roughness:.3});
          const greenEyes=new THREE.MeshStandardMaterial({color:0x437b5e,roughness:.35});
          const pupil=new THREE.MeshStandardMaterial({color:0x172923,roughness:.32});
          const lashes=new THREE.MeshStandardMaterial({color:0x503d30,roughness:.85});
          const shoeMat=new THREE.MeshStandardMaterial({color:0x3b2c30,roughness:.66});
          const accentMaterials=['#9b4561','#344f48','#343d65'].map(x=>new THREE.MeshStandardMaterial({color:rgba(x),roughness:.82,side:THREE.DoubleSide}));
          let outfitIdx=0,drawOk=false;
          function mesh(geo,mat,parent,x=0,y=0,z=0,scale=null){const o=new THREE.Mesh(geo,mat);o.position.set(x,y,z);if(scale)o.scale.set(...scale);o.castShadow=true;o.receiveShadow=true;parent.add(o);return o}
          function ell(parent,mat,x,y,z,a,b,c){return mesh(new THREE.SphereGeometry(1,24,16),mat,parent,x,y,z,[a,b,c])}
          function cyl(parent,mat,x,y,z,ra,rb,h,rotZ=0){const obj=mesh(new THREE.CylinderGeometry(ra,rb,h,20),mat,parent,x,y,z);obj.rotation.z=rotZ;return obj}
