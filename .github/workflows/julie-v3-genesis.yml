          cat > 'julie-v3-genesis/README.md' <<'JULIE_GENESIS_V3_FILE_9_END'
          # JULIE V3 — Maillage humain d'origine Genesis / Ève

          ## Objectif
          Remplacer la figurine stylisée des prototypes V1/V2 par un véritable maillage humanoïde texturé et skinné, basé sur le **même GLB MakeHuman/MPFB CC0 que le simulateur Genesis**. Julie conserve son identifiant `JULIE_001` et ses paramètres initiaux (22 ans, 1,75 m, silhouette fine).

          ## Ce que cette V3 fait réellement
          - Télécharge le modèle source public `vsim/packages/assets/library/human.glb` pendant la compilation GitHub Actions et l'embarque localement dans l'APK (pas d'accès Internet à l'exécution).
          - Animation GLB de repos, squelette d'animation existant (environ 53 os), rotation tactile, proportions à 1,75 m.
          - Ajustement féminin **simplifié et prudent** reprenant la méthode de morphologie morphométrique de Genesis ; conserve les textures et les poids des os.
          - Corrige les surfaces de peau parfois déclarées transparentes par erreur (problème déjà traité dans Genesis).
          - Conserve la maquette Android (chat de démonstration hors ligne, export/import de souvenirs de test). Identifiant Android distinct `com.julie.preview.v3`.

          ## Ce qui reste à faire pour reproduire exactement Ève
          Le modèle Genesis d'Ève n'est **pas** un second fichier GLB distinct. Genesis charge un modèle commun, puis applique de multiples modules : variantes anatomiques, visage, peau, morphs, cheveux, mouvements et état physiologique. La V3 réutilise la base et une première adaptation féminine, **pas encore l'ensemble** des adaptations d'Ève. Les cheveux blonds mi-longs et la couleur des iris nécessiteront une validation visuelle et des assets/contrôles supplémentaires. L'apparence n'est pas encore photoréaliste.

          ## Sécurité
          Aucune donnée Genesis ou mémoire d'Ève n'est transférée ; aucun abonnement ni service payant ajouté. Le dépôt Genesis reste inchangé. Le prototype ne synchronise pas avec le vrai moteur de mémoire de Human Partner. Exporter les souvenirs de V1/V2/V2.1 avant désinstallation : aucune importation silencieuse. Ne pas stocker d'informations sensibles dans la mémoire de démonstration non chiffrée.

          ## Source et licence
          Voir `CREDITS_MODELE.md`. La source humaine CC0 est publique ; toute future texture tierce devra faire l'objet d'une vérification de licence distincte.

          ## Compilation
          Ajouter `.github/workflows/julie-v3-genesis.yml` à la branche `julie-v1`. GitHub Actions vérifie le GLB, effectue les tests JS et compile l'APK. Si le téléchargement public échoue, l'installation échoue explicitement plutôt que de retomber sur un mannequin géométrique trompeur.
          JULIE_GENESIS_V3_FILE_9_END
          cat > 'julie-v3-genesis/CREDITS_MODELE.md' <<'JULIE_GENESIS_V3_FILE_10_END'
          # Origine du modèle humain de Julie V3

          Le projet privé Genesis utilise `web/public/assets/human-realistic.glb` et cite comme source `kunalkushwaha/vsim/packages/assets/library/human.glb` (MakeHuman/MPFB, CC0).

          L’APK V3 télécharge **le même fichier source public** à la compilation, sans accéder aux données ni au serveur de Genesis. La morphologie féminine initiale s’inspire des principes du moteur Genesis, mais la version V3 ne reproduit pas encore toutes les transformations de l’Ève du jeu (peau dynamique, morphs complets, historique biologique).

          Source : https://github.com/kunalkushwaha/vsim/blob/main/packages/assets/library/human.glb
          Guide : https://github.com/kunalkushwaha/vsim/blob/main/docs/guides/blender-characters.md
          Licence du modèle généré : CC0 ; vérifier séparément tout futur accessoire ou texture de tiers.

          Identité de Julie : JULIE_001. Les données d’Ève et la base Genesis ne sont jamais copiées.
          JULIE_GENESIS_V3_FILE_10_END

      - name: Charger à la compilation la base humaine CC0 utilisée dans Genesis
        shell: bash
        run: |
          set -euo pipefail
          MODEL="julie-v3-genesis/www/models/julie_genesis_human.glb"
          curl --fail --location --retry 3 --retry-delay 3 --connect-timeout 20 --max-time 180 \
            "https://raw.githubusercontent.com/kunalkushwaha/vsim/main/packages/assets/library/human.glb" \
            --output "$MODEL"
          test -s "$MODEL"
          python3 - <<'PYCHECK'
          import json,struct
          from pathlib import Path
          path=Path('julie-v3-genesis/www/models/julie_genesis_human.glb')
          b=path.read_bytes()
          assert len(b)>500_000, 'Le GLB est trop petit'
          magic,version,declared=struct.unpack_from('<4sII',b,0)
          assert magic==b'glTF' and version==2 and declared==len(b), 'Entête GLB invalide'
          n,kind=struct.unpack_from('<I4s',b,12)
          assert kind==b'JSON', 'JSON glTF absent'
          gltf=json.loads(b[20:20+n])
          mesh_count=len(gltf.get('meshes',[]))
          skins=gltf.get('skins',[])
          clips=gltf.get('animations',[])
          joint_count=max((len(x.get('joints',[])) for x in skins),default=0)
          assert mesh_count>0 and joint_count>=30 and len(clips)>0, f'Maillage/rig/animations incomplets: {mesh_count}, {joint_count}, {len(clips)}'
          print(f'MODELE GENESIS CC0 : {len(b):,} octets, {mesh_count} maillages, {joint_count} os, {len(clips)} animations')
          PYCHECK

      - name: Tests JS et intégrité hors ligne
        shell: bash
        run: |
          set -euo pipefail
          node --check julie-v3-genesis/www/app.mjs
          node --check julie-v3-genesis/www/avatar-utils.mjs
          node --check julie-v3-genesis/www/eve-derived.mjs
          node --test julie-v3-genesis/tests/eve-derived.test.mjs
          python3 - <<'PYSAFETY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          d=Path('julie-v3-genesis')
          xml=(d/'android/AndroidManifest.xml').read_text()
          ET.fromstring(xml)
          assert 'android.permission.INTERNET' not in xml
          assert 'allowBackup="false"' in xml
          app=(d/'www/app.mjs').read_text()
          assert './models/julie_genesis_human.glb' in app
          assert 'adaptEveDerivedFemaleMesh' in app
          assert 'GLTFLoader' in app
          html=(d/'www/index.html').read_text()
          assert all(v in html for v in ['julie-3d','Souvenirs','Réglages'])
          assert (d/'www/models/julie_genesis_human.glb').stat().st_size>500000
          print('Contrôle sécurité, origine GLB, interface, mémoire de démo : OK')
          PYSAFETY

      - name: Construire le JavaScript 3D local
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix julie-v3-genesis --no-save --no-audit --no-fund \
            three@0.181.1 esbuild@0.25.12
          ./julie-v3-genesis/node_modules/.bin/esbuild julie-v3-genesis/www/app.mjs \
            --bundle --format=iife --platform=browser --target=es2020 \
            --outfile=julie-v3-genesis/www/app.js
          test -s julie-v3-genesis/www/app.js

      - name: Préparer une APK distincte (ne remplace ni V1 ni V2.1)
        shell: bash
        run: |
          set -euo pipefail
          cp julie-v3-genesis/android/MainActivity.java android/app/src/main/java/com/humanpartner/MainActivity.java
          cp julie-v3-genesis/android/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          mkdir -p android/app/src/main/assets/julie/models android/app/src/main/res/drawable
          cp julie-v3-genesis/android/julie_icon.xml android/app/src/main/res/drawable/julie_icon.xml
          cp julie-v3-genesis/www/index.html julie-v3-genesis/www/style.css \
            julie-v3-genesis/www/app.js android/app/src/main/assets/julie/
          cp julie-v3-genesis/www/models/julie_genesis_human.glb android/app/src/main/assets/julie/models/
          python3 - <<'PYBUILD'
          from pathlib import Path
          f=Path('android/app/build.gradle')
          text=f.read_text()
          assert text.count("applicationId 'com.humanpartner'")==1, 'Identifiant historique introuvable'
          text=text.replace("applicationId 'com.humanpartner'","applicationId 'com.julie.preview.v3'")
          text=text.replace("versionCode 9","versionCode 12")
          text=text.replace("versionName '0.1.8'","versionName '0.3.0-genesis'")
          f.write_text(text)
          print('Application Android séparée : com.julie.preview.v3')
          PYBUILD

      - name: Compiler l'APK Android
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Vérifier le contenu réel de l'APK
        shell: bash
        run: |
          set -euo pipefail
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -Z1 "$APK" | grep -Fx 'assets/julie/models/julie_genesis_human.glb'
          unzip -Z1 "$APK" | grep -Fx 'assets/julie/app.js'
          unzip -Z1 "$APK" | grep -Fx 'classes.dex'
          mkdir -p julie-v3-genesis-artifact
          cp "$APK" julie-v3-genesis-artifact/JULIE-V3-Genesis-debug.apk
          cp julie-v3-genesis/README.md julie-v3-genesis-artifact/LIRE_AVANT_INSTALLATION.md
          cp julie-v3-genesis/CREDITS_MODELE.md julie-v3-genesis-artifact/CREDITS_MODELE.md
          sha256sum julie-v3-genesis-artifact/JULIE-V3-Genesis-debug.apk > julie-v3-genesis-artifact/SHA256SUMS.txt
          ls -lh julie-v3-genesis-artifact

      - name: Publier l'APK V3
        uses: actions/upload-artifact@v4
        with:
          name: Julie-V3-Genesis-APK
          path: julie-v3-genesis-artifact/
          retention-days: 14
          if-no-files-found: error

      - name: Archiver le code V3 sur julie-v1 après tests
        shell: bash
        run: |
          set -euo pipefail
          git add -- julie-v3-genesis/www/index.html julie-v3-genesis/www/style.css \
            julie-v3-genesis/www/app.mjs julie-v3-genesis/www/avatar-utils.mjs \
            julie-v3-genesis/www/eve-derived.mjs julie-v3-genesis/android/MainActivity.java \
            julie-v3-genesis/android/AndroidManifest.xml julie-v3-genesis/android/julie_icon.xml \
            julie-v3-genesis/README.md julie-v3-genesis/CREDITS_MODELE.md \
            julie-v3-genesis/tests/eve-derived.test.mjs
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'Code V3 déjà sauvegardé'
            exit 0
          fi
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m 'feat(julie): intégrer le maillage humain Genesis dans APK V3'
          git push origin HEAD:julie-v1
