      - name: Vérifier le code et la construction de la scène simulée
        shell: bash
        run: |
          set -euo pipefail
          node --check julie-preview/www/app.mjs
          node --test julie-preview/tests/smoke_v2.cjs
          npm run check
      - name: Construire le moteur 3D local avec Three.js
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix julie-preview --no-save --no-package-lock --no-audit --no-fund three@0.180.0 esbuild@0.25.12
          julie-preview/node_modules/.bin/esbuild julie-preview/www/app.mjs --bundle --minify --format=iife --platform=browser --target=es2020 --outfile=julie-preview/www/app.js
          test -s julie-preview/www/app.js
          node --check julie-preview/www/app.js
      - name: Préparer l'application Android indépendante
        shell: bash
        run: |
          set -euo pipefail
          # Les sources historiques restent inchangées dans Git : compilation isolée.
          cp julie-preview/android/MainActivity.java android/app/src/main/java/com/humanpartner/MainActivity.java
          cp julie-preview/android/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          mkdir -p android/app/src/main/assets/julie android/app/src/main/res/drawable
          cp julie-preview/www/index.html julie-preview/www/style.css julie-preview/www/app.js android/app/src/main/assets/julie/
          cp julie-preview/android/julie_icon.xml android/app/src/main/res/drawable/julie_icon.xml
          python3 - <<'PY_ANDROID_CONFIG'
          from pathlib import Path
          f=Path('android/app/build.gradle')
          s=f.read_text()
          expected="applicationId 'com.humanpartner'"
          assert s.count(expected)==1, 'Identifiant Android historique inattendu'
          s=s.replace(expected,"applicationId 'com.julie.preview.v21'")
          assert "versionCode 9" in s, 'versionCode inattendu'
          assert "versionName '0.1.8'" in s, 'versionName inattendu'
          s=s.replace('versionCode 9','versionCode 12')
          s=s.replace("versionName '0.1.8'","versionName '0.2.1-julie-v2-fix'")
          f.write_text(s)
          print('APK séparée : com.julie.preview.v21')
          PY_ANDROID_CONFIG
      - name: Compiler l'APK Android de Julie V2
        working-directory: android
        shell: bash
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Vérifier le fichier APK et le préparer
        shell: bash
        run: |
          set -euo pipefail
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -l "$APK" | grep -q 'assets/julie/index.html'
          unzip -l "$APK" | grep -q 'assets/julie/app.js'
          unzip -l "$APK" | grep -q 'classes.dex'
          mkdir -p julie-v2-1-artifact
          cp "$APK" julie-v2-1-artifact/JULIE-V2-1-Correctif-debug.apk
          cp julie-preview/README.md julie-v2-1-artifact/LIRE_AVANT_INSTALLATION.md
          sha256sum "$APK" > julie-v2-1-artifact/SHA256_SOURCE_APK.txt
          ls -lh julie-v2-1-artifact
      - name: Rendre l'APK téléchargeable depuis GitHub
        uses: actions/upload-artifact@v4
        with:
          name: Julie-V2-1-APK
          path: julie-v2-1-artifact/
          retention-days: 14
          if-no-files-found: error
      - name: Sauvegarder les nouvelles sources de Julie V2 sur julie-v1
        shell: bash
        run: |
          set -euo pipefail
          git add -- julie-preview/www/app.mjs julie-preview/www/index.html julie-preview/www/style.css \
            julie-preview/android/AndroidManifest.xml julie-preview/README.md julie-preview/tests/smoke_v2.cjs
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'Sources V2 déjà présentes, rien à changer'
            exit 0
          fi
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m 'feat(julie): correctif corps et robe V2.1'
          git push origin HEAD:julie-v1
