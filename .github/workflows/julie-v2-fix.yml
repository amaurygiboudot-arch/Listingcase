          vm.createContext(context);
          vm.runInContext(script.replace("import * as THREE from 'three';",'const THREE = globalThis.THREE;'),context,{timeout:30000,filename:'julie-v2-stub-runtime.js'});
          assert.equal(rendererUsed,true);
