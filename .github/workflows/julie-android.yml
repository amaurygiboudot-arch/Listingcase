name: JULIE Android - canal unique

on:
  push:
    branches: [julie-v1]
    paths:
      - '.github/workflows/julie-android.yml'
      - 'julie-v3-genesis/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: julie-android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Tester Julie et compiler Android
    if: github.ref == 'refs/heads/julie-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Lire les sources et garder la sauvegarde
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Contrôler le périmètre de Julie
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = julie-v1
          git ls-remote --exit-code origin refs/heads/backup-human-partner-20261009 >/dev/null
          test -f android/app/build.gradle
          test -f julie-v3-genesis/www/state-store.mjs
          test -f julie-v3-genesis/android/JulieSecureStore.java
          node -e "const p=require('./config/predefined-characters.json');if(!p.find(x=>x.personId==='JULIE_001')||!p.find(x=>x.personId==='CHLOE_001'))process.exit(1);"
      - name: Installer Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Préparer Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Télécharger et valider la base humaine CC0 de Genesis
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p julie-v3-genesis/www/models
          curl --fail --location --retry 3 --retry-delay 3 --connect-timeout 20 --max-time 180 \
            'https://raw.githubusercontent.com/kunalkushwaha/vsim/main/packages/assets/library/human.glb' \
            -o julie-v3-genesis/www/models/julie_genesis_human.glb
          python3 - <<'PYMODEL'
          from pathlib import Path
          import json,struct
          blob=Path('julie-v3-genesis/www/models/julie_genesis_human.glb').read_bytes()
          assert len(blob)>500000,'GLB trop petit'
          magic,version,declared=struct.unpack_from('<4sII',blob,0)
          assert magic==b'glTF' and version==2 and declared==len(blob),'GLB invalide'
          length,kind=struct.unpack_from('<I4s',blob,12)
          assert kind==b'JSON'
          model=json.loads(blob[20:20+length])
          bones=max((len(x.get('joints',[])) for x in model.get('skins',[])),default=0)
          assert bones>=30 and model.get('meshes') and model.get('animations'),'Maillage humain/rig/animations manquants'
          print(f'Maillage Genesis valide : {len(blob)} octets et {bones} os')
          PYMODEL
      - name: Tester mémoire, identité et JavaScript
        shell: bash
        run: |
          set -euo pipefail
          for f in julie-v3-genesis/www/*.mjs; do node --check "$f"; done
          node --test julie-v3-genesis/tests/*.mjs
          python3 - <<'PYCHECK'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          d=Path('julie-v3-genesis')
          manifest=(d/'android/AndroidManifest.xml').read_text()
          ET.fromstring(manifest)
          assert 'android.permission.INTERNET' in manifest and 'android.permission.REQUEST_INSTALL_PACKAGES' in manifest and 'android.permission.ACCESS_NETWORK_STATE' in manifest
          assert 'allowBackup="false"' in manifest
          java=(d/'android/JulieSecureStore.java').read_text()
          assert 'AndroidKeyStore' in java and 'AES/GCM/NoPadding' in java
          assert 'prefs.edit().putString(ENCRYPTED_KEY,encrypted).remove(OLD_KEY).commit()' in java
          app=(d/'www/app.mjs').read_text()
          assert 'appendConversation(saved' in app and 'mergeImport(saved' in app
          assert 'slice(-120)' not in app and 'slice(-60)' not in app
          assert './models/julie_genesis_human.glb' in app
          assert 'stripGenesisConstructionHelpers(root)' in app
          assert (d/'integration/check-genesis-body.mjs').exists()
          updater=(d/'android/JulieUpdateManager.java').read_text()
          assert 'sha256' in updater and 'PackageInstaller.SessionParams.MODE_FULL_INSTALL' in updater
          assert 'activity.getPackageName().equals(candidate.packageName)' in updater
          assert 'PackageManager.GET_SIGNING_CERTIFICATES' in updater
          assert 'NET_CAPABILITY_NOT_METERED' in updater
          assert (d/'android/JulieInstallReceiver.java').exists()
          print('Identité, schéma mémoire, accès HTTPS et validation d’installation : OK')
          PYCHECK
      - name: Construire JavaScript 3D embarqué
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix julie-v3-genesis --no-save --no-audit --no-fund three@0.181.1 esbuild@0.25.12
          node julie-v3-genesis/integration/check-genesis-body.mjs
          ./julie-v3-genesis/node_modules/.bin/esbuild julie-v3-genesis/www/app.mjs \
            --bundle --format=iife --platform=browser --target=es2020 \
            --outfile=julie-v3-genesis/www/app.js
          test -s julie-v3-genesis/www/app.js
      - name: Préparer Android sans modifier Human Partner
        shell: bash
        run: |
          set -euo pipefail
          cp julie-v3-genesis/android/MainActivity.java android/app/src/main/java/com/humanpartner/MainActivity.java
          cp julie-v3-genesis/android/JulieSecureStore.java android/app/src/main/java/com/humanpartner/JulieSecureStore.java
          cp julie-v3-genesis/android/JulieUpdateManager.java julie-v3-genesis/android/JulieInstallReceiver.java android/app/src/main/java/com/humanpartner/
          cp julie-v3-genesis/android/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          mkdir -p android/app/src/main/assets/julie/models android/app/src/main/res/drawable
          cp julie-v3-genesis/android/julie_icon.xml android/app/src/main/res/drawable/julie_icon.xml
          cp julie-v3-genesis/www/index.html julie-v3-genesis/www/style.css \
            julie-v3-genesis/www/app.js android/app/src/main/assets/julie/
          cp julie-v3-genesis/www/models/julie_genesis_human.glb android/app/src/main/assets/julie/models/
          python3 - <<'PYGRADLE'
          from pathlib import Path
          p=Path('android/app/build.gradle');s=p.read_text()
          assert s.count("applicationId 'com.humanpartner'")==1
          s=s.replace("applicationId 'com.humanpartner'","applicationId 'com.julie.preview.v3'")
          s=s.replace('versionCode 9',"versionCode "+str(300000+int('${{ github.run_number }}')))
          s=s.replace("versionName '0.1.8'","versionName '0.3.4-dev.${{ github.run_number }}'")
          p.write_text(s)
          PYGRADLE
      - name: Compiler APK Android de test
        shell: bash
        working-directory: android
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Contrôler APK et préparer téléchargement
        shell: bash
        run: |
          set -euo pipefail
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -Z1 "$APK" | grep -Fx assets/julie/models/julie_genesis_human.glb
          unzip -Z1 "$APK" | grep -Fx assets/julie/app.js
          unzip -Z1 "$APK" | grep -Fx classes.dex
          mkdir -p julie-android-artifact
          cp "$APK" julie-android-artifact/JULIE-Android-0.3.4-debug.apk
          cp julie-v3-genesis/README.md julie-android-artifact/LIRE_AVANT_INSTALLATION.md
          cp julie-v3-genesis/CREDITS_MODELE.md julie-android-artifact/CREDITS_MODELE.md
          (cd julie-android-artifact && sha256sum JULIE-Android-0.3.4-debug.apk > SHA256SUMS.txt)
      - name: Publier Julie Android
        uses: actions/upload-artifact@v4
        with:
          name: Julie-Android-APK
          path: julie-android-artifact/
          retention-days: 14
          if-no-files-found: error

      - name: Vérifier si la signature permanente est configurée
        id: signing
        shell: bash
        env:
          JULIE_KEYSTORE_B64: ${{ secrets.JULIE_ANDROID_KEYSTORE_BASE64 }}
          JULIE_STORE_PASSWORD: ${{ secrets.JULIE_ANDROID_STORE_PASSWORD }}
          JULIE_KEY_ALIAS: ${{ secrets.JULIE_ANDROID_KEY_ALIAS }}
          JULIE_KEY_PASSWORD: ${{ secrets.JULIE_ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -n "$JULIE_KEYSTORE_B64" && -n "$JULIE_STORE_PASSWORD" && -n "$JULIE_KEY_ALIAS" && -n "$JULIE_KEY_PASSWORD" ]]; then
            echo 'configured=true' >> "$GITHUB_OUTPUT"
            echo 'Signature permanente détectée ; préparer une release signée.'
          else
            echo 'configured=false' >> "$GITHUB_OUTPUT"
            echo 'Aucune signature permanente ; pas de publication automatique. APK debug conservée.'
          fi
      - name: Compiler une APK signée sans exposer la clef
        if: steps.signing.outputs.configured == 'true'
        shell: bash
        env:
          JULIE_KEYSTORE_B64: ${{ secrets.JULIE_ANDROID_KEYSTORE_BASE64 }}
          JULIE_STORE_PASSWORD: ${{ secrets.JULIE_ANDROID_STORE_PASSWORD }}
          JULIE_KEY_ALIAS: ${{ secrets.JULIE_ANDROID_KEY_ALIAS }}
          JULIE_KEY_PASSWORD: ${{ secrets.JULIE_ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          export JULIE_SIGNING_FILE="$RUNNER_TEMP/julie-android-private.jks"
          trap 'rm -f "$JULIE_SIGNING_FILE"' EXIT
          printf '%s' "$JULIE_KEYSTORE_B64" | base64 --decode > "$JULIE_SIGNING_FILE"
          test -s "$JULIE_SIGNING_FILE"
          cat >> android/app/build.gradle <<'GRADLESIGN'
          android {
              signingConfigs {
                  julieStable {
                      storeFile file(System.getenv('JULIE_SIGNING_FILE'))
                      storePassword System.getenv('JULIE_STORE_PASSWORD')
                      keyAlias System.getenv('JULIE_KEY_ALIAS')
                      keyPassword System.getenv('JULIE_KEY_PASSWORD')
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.julieStable
                  }
              }
          }
          GRADLESIGN
          (cd android && gradle --no-daemon --stacktrace :app:assembleRelease)
          APK=android/app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -mindepth 2 -maxdepth 2 -name apksigner | sort -V | tail -1)"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --print-certs "$APK" > "$RUNNER_TEMP/julie-cert-summary.txt"
          grep -q '^Signer #1 certificate SHA-256 digest:' "$RUNNER_TEMP/julie-cert-summary.txt"
          echo 'APK permanente compilée et signature vérifiée.'
      - name: Publier l'APK permanente et son empreinte sur GitHub Releases
        if: steps.signing.outputs.configured == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          APK=android/app/build/outputs/apk/release/app-release.apk
          TAG=julie-android-updates
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -mindepth 2 -maxdepth 2 -name apksigner | sort -V | tail -1)"
          NEW_CERT="$("$APKSIGNER" verify --print-certs "$APK" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -1)"
          [[ "$NEW_CERT" =~ ^[[:xdigit:]]{64}$ ]]
          if gh release view "$TAG" >/dev/null 2>&1; then
            mkdir -p "$RUNNER_TEMP/julie-previous-release"
            gh release download "$TAG" -p 'JULIE-Android.apk' -D "$RUNNER_TEMP/julie-previous-release" --clobber
            OLD_APK="$RUNNER_TEMP/julie-previous-release/JULIE-Android.apk"
            test -s "$OLD_APK"
            OLD_CERT="$("$APKSIGNER" verify --print-certs "$OLD_APK" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -1)"
            test "$NEW_CERT" = "$OLD_CERT" || { echo 'Signature différente de la release précédente : publication BLOQUÉE.'; exit 1; }
          fi
          export JULIE_RELEASE_APK="$APK"
          export JULIE_RELEASE_VERSIONCODE="$((300000+${{ github.run_number }}))"
          export JULIE_RELEASE_VERSIONNAME="0.3.4-dev.${{ github.run_number }}"
          python3 - <<'PYRELEASE'
          import hashlib,json,os
          from pathlib import Path
          apk=Path(os.environ['JULIE_RELEASE_APK'])
          manifest={
            'packageName':'com.julie.preview.v3',
            'versionCode':int(os.environ['JULIE_RELEASE_VERSIONCODE']),
            'versionName':os.environ['JULIE_RELEASE_VERSIONNAME'],
            'sha256':hashlib.sha256(apk.read_bytes()).hexdigest(),
            'notes':'Mise à jour de Julie : mémoire préservée et gestionnaire de mises à jour vérifié.'
          }
          Path(os.environ['RUNNER_TEMP'],'julie-release-notes.json').write_text(
            json.dumps(manifest,ensure_ascii=False,separators=(',',':')),encoding='utf-8')
          PYRELEASE
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK#JULIE-Android.apk" --clobber
            gh release edit "$TAG" --notes-file "$RUNNER_TEMP/julie-release-notes.json"
          else
            gh release create "$TAG" "$APK#JULIE-Android.apk" \
              --title 'JULIE Android • mises à jour' --latest=false \
              --target julie-v1 --notes-file "$RUNNER_TEMP/julie-release-notes.json"
          fi
          echo 'Release signée et manifeste de version publiés.'
      - name: Enregistrer la preuve du build réussi
        shell: bash
        run: |
          set -euo pipefail
          # Plusieurs builds peuvent terminer pendant que la branche avance.
          # Ne jamais échouer uniquement parce qu'un commit plus récent est arrivé.
          # Aucune source de l'application n'est réécrite par cette étape.
          for attempt in 1 2 3 4; do
            git fetch --no-tags origin julie-v1
            git reset --hard origin/julie-v1
            mkdir -p docs
            {
              echo '# Dernière compilation JULIE vérifiée'
              echo
              echo "Commit source : $GITHUB_SHA"
              echo "Exécution : https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
              echo 'Tests : morphologie, mémoire, mise à jour, topologie Genesis sur vrai GLB, APK Android'
              echo 'Artefact : Julie-Android-APK'
              echo 'Statut : compilation et publication réussies'
            } > docs/JULIE_BUILD_STATUS.md
            git add -- docs/JULIE_BUILD_STATUS.md
            if git diff --cached --quiet; then
              echo 'Preuve déjà à jour'
              exit 0
            fi
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m 'ci(julie): enregistrer build Android réussi'
            if git push origin HEAD:julie-v1; then
              echo 'Preuve de compilation sauvegardée'
              exit 0
            fi
            echo "La branche a avancé ; nouvel essai $attempt/4"
            sleep "$attempt"
          done
          echo 'La preuve de compilation n’a pas pu être sauvegardée' >&2
          exit 1
