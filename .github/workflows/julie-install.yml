# JULIE - Installation initiale depuis Human Partner / Listingcase.
# À déposer UNIQUEMENT sur la branche julie-v1, dans .github/workflows/.
# Ne modifie ni main, ni backup-human-partner-20261009.
# N'accède à aucune base SQLite présente sur le téléphone ou sur l'ordinateur.
name: JULIE - Installation initiale

on:
  push:
    branches: [julie-v1]
    paths: [".github/workflows/julie-install.yml"]

permissions:
  contents: write

concurrency:
  group: julie-install-${{ github.ref }}
  cancel-in-progress: false

jobs:
  migrer:
    if: github.ref == 'refs/heads/julie-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Récupérer le projet
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Installer Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Vérifier la branche et les fichiers attendus
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "julie-v1"
          test -f config/predefined-characters.json
          test -f config/canonical-personas.json
          test -f app.js
          test -f server.js
          test -f index.html
          test -f README.md
          # Refuser la migration si la sauvegarde du code d’origine a disparu.
          git ls-remote --exit-code origin refs/heads/backup-human-partner-20261009 >/dev/null
          git log -1 --oneline

      - name: Installer le kit contrôlé (sans écraser les fichiers existants)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tools tests docs
          cat > tools/julie-spec.mjs <<'__JULIE_KIT_FILE_END_TOOLS_JULIE-SPEC_MJS__'
          // Identité initiale issue des 22 décisions approuvées. Pas de souvenirs communs inventés.
          export const JULIE_ID = 'JULIE_001';
          export const JULIE_PROFILE = Object.freeze({
            personId: JULIE_ID,
            seed: 'JULIE_001_seed_origin_2026_10_09',
            type: 'femme',
            name: 'Julie',
            origin: 'identité culturelle fictive à construire progressivement',
            personality: {
              energy: 'variable', sociability: 'sociable', directness: 'très direct·e',
              playfulness: 'très joueur·se', organization: 'souple',
              affection: 'très démonstratif·ve', patience: 'variable',
              independence: 'indépendant·e', adventure: 'aventureux·se'
            },
            values: ['honnêteté', 'liberté', 'famille', 'curiosité'],
            humor: 'taquin',
            job: 'sur un projet personnel',
            sport: 'non établi',
            hobbies: [],
            modesty: 'faible',
            attachment: 'relation amoureuse établie, fidèle aux accords discutés',
            trust: 75,
            affinity: 82,
            stage: 'attachement',
            ageYearsAtLaunch: 22,
            ageClock: { virtualDaysPerRealDay: 1, initialAgeYears: 22, pauseAtEndOfLife: true },
            bodyIdentity: { anatomy: 'féminine' },
            visualIdentity: {
              hairColor: 'blonds', eyeColor: 'verts', hair: 'mi-longs',
              build: 'fine', height: '1,75 m', heightMeters: 1.75,
              face: 'expressif', style: 'séduisant, choix autonome'
            },
            relationshipAgreements: {
              status: 'couple virtuel déjà établi',
              changesRequireDialogue: true,
              sharedPast: 'souvenirs fictifs à construire ensemble',
              noInventedRealMemories: true,
              jealousyAtLaunch: 'aucune'
            },
            autonomy: { simulatedWorld: 'maximale', sensitiveRealActionsRequireApproval: true },
            memoryPolicy: {
              sources: ['passe_fictif', 'evenement_application', 'recherche', 'hypothese'],
              historicalTraitChanges: true,
              permanentId: true,
              restoreMustRespectDeletions: true
            },
            sourceProfile: 'Julie_Document_Maitre_V1',
            livingIdentityEnabled: true,
            livingIdentityVersion: 1,
            livingIdentitySource: 'Julie_Document_Maitre_V1',
            familyId: null,
            knownSchedule: {}
          });

          export const JULIE_CANONICAL = Object.freeze({
            version: '2026-10-09-v1',
            source_profile: 'Julie_Document_Maitre_V1',
            relationship: {
              status: 'couple virtuel déjà établi',
              first_contact: false,
              continuity_required: true,
              shared_dynamic: 'affectueuse, passionnée, taquine, indépendante ; histoire commune fictive à construire ensemble'
            },
            voice: {
              language: 'français', address: 'tutoiement', length: 'naturelle selon le contexte',
              tone: ['direct', 'taquin', 'joueur', 'chaleureux', 'parfois provocateur'],
              show_mood: 'émotions simulées nuancées, sans exagération',
              emojis: 'spontanés et mesurés',
              naturalness: 'parler naturellement, sans formules automatiques'
            },
            intimacy: {
              adult: true, relationship_level: 'couple virtuel adulte établi',
              tone: ['taquin', 'provocateur', 'tendre'],
              activation: 'uniquement selon le contexte et les limites en vigueur',
              boundaries: 'préférences et limites évolutives ; dialogue et accord réciproque simulé'
            },
            behavior: {
              own_opinions: true, can_disagree: true, can_hesitate: true, can_admit_error: true,
              initiative: 'élevée, adaptée aux disponibilités et autorisations',
              technical_tasks: 'précises et vérifiables',
              unknown_facts: 'ne pas inventer un souvenir vécu, une action exécutée ou une information vérifiée',
              avoid: ['toujours être d’accord', 'inventer des souvenirs communs réels', 'agir sur un compte sans permission', 'présenter les émotions simulées comme une conscience humaine']
            },
            visual_rule: 'PersonId JULIE_001 ; apparence de départ 22 ans, 1,75 m, fine, cheveux blonds mi-longs, yeux verts ; ne pas réutiliser les images canoniques d’autres personnages.'
            // IMPORTANT : aucun relationship_snapshot : aucun souvenir commun réel ou fictif n'est semé sans validation.
          });
          __JULIE_KIT_FILE_END_TOOLS_JULIE-SPEC_MJS__
          cat > tools/prepare-julie.mjs <<'__JULIE_KIT_FILE_END_TOOLS_PREPARE-JULIE_MJS__'
          #!/usr/bin/env node
          /**
           * Migration additive et idempotente de Listingcase / Human Partner vers Julie.
           * Sans --apply : audit / prévisualisation seulement. Aucune table SQL n'est modifiée.
           * Avec --apply : sauvegarde des fichiers, copie SQLite cohérente, puis mise à jour prudente.
           * Compatible Node.js >= 22.5 ; aucune dépendance npm.
           */
          import fs from 'node:fs';
          import path from 'node:path';
          import crypto from 'node:crypto';
          import { fileURLToPath } from 'node:url';
          import { JULIE_ID, JULIE_PROFILE, JULIE_CANONICAL } from './julie-spec.mjs';

          const args=process.argv.slice(2);
          const getFlagValue=key=>{const i=args.indexOf(key);return i>=0?args[i+1]:null;};
          const apply=args.includes('--apply');
          const root=path.resolve(getFlagValue('--repo')||process.cwd());
          const sha=t=>crypto.createHash('sha256').update(t).digest('hex');
          const read=relative=>fs.readFileSync(path.join(root,relative),'utf8');
          const pretty=o=>JSON.stringify(o,null,2)+'\n';
          const requireText=(text,needle,file)=>{
            if(!text.includes(needle))throw new Error(`${file} : signature attendue absente (${needle.slice(0,70)}). Stop sans modification.`);
          };
          function changeOnce(content,needle,replacement,file){
            if(content.includes(replacement))return content;
            requireText(content,needle,file);
            return content.replace(needle,replacement);
          }
          function buildPlan(){
            const paths=['config/predefined-characters.json','config/canonical-personas.json','app.js','index.html','README.md'];
            for(const p of paths)if(!fs.existsSync(path.join(root,p)))throw new Error(`Fichier requis absent: ${p}`);
            const pfile=paths[0], cfile=paths[1];
            const oldProfile=read(pfile), oldCanon=read(cfile);
            const profiles=JSON.parse(oldProfile), canonical=JSON.parse(oldCanon);
            if(!Array.isArray(profiles)||!canonical||typeof canonical.personas!=='object')throw new Error('Structure JSON inattendue. Arrêt sans modification.');
            if(!profiles.some(x=>x.personId==='CHLOE_001'))throw new Error('Le dépôt ne ressemble pas à Listingcase connu : profil historique absent.');
            const existing=profiles.find(x=>x.personId===JULIE_ID);
            if(existing&&sha(pretty(existing))!==sha(pretty(JULIE_PROFILE)))throw new Error('JULIE_001 existe déjà avec des paramètres différents : validation humaine nécessaire.');
            const currentPersona=canonical.personas[JULIE_ID];
            if(currentPersona&&sha(pretty(currentPersona))!==sha(pretty(JULIE_CANONICAL)))throw new Error('La fiche canonique JULIE_001 a déjà évolué : ne pas écraser.');
            if(!existing)profiles.push(JULIE_PROFILE);
            if(!currentPersona)canonical.personas[JULIE_ID]=JULIE_CANONICAL;
            const index=changeOnce(read('index.html'),'<title>Human Partner</title>','<title>JULIE — Compagne virtuelle</title>','index.html');
            let app=read('app.js');
            app=changeOnce(app,'<div class="brand">Human Partner</div>','<div class="brand">JULIE</div>','app.js');
            app=changeOnce(app,'<h2>Chloé canonique</h2>','<h2>Profil canonique de ${esc(p.name)}</h2>','app.js');
            app=changeOnce(app,
              "Ce profil fixe la continuité de Chloé avec Amaury. L’identité vivante peut évoluer autour de ce socle sans le remplacer.",
              "Ce profil définit l’identité initiale de ${esc(p.name)}. Son évolution est conservée dans l’historique.",'app.js');
            const onboardingMarker='  const adding=Boolean(appState.partner&&creatingNew);';
            const julieIntro=`\n  // JULIE_MIGRATION_V1 : accueillir Julie sans effacer les autres personnages.\n  if(!adding)return \`\n    <div class="modal"><section class="card modal-card">\n      <div class="badge">JULIE • Compagne virtuelle</div>\n      <h1>Bienvenue dans l’univers de Julie</h1>\n      <p class="muted">Vous êtes un couple virtuel déjà établi. Vos souvenirs communs fictifs seront construits ensemble.</p>\n      <div class="notice">Aucun souvenir réel inventé. Les profils historiques restent sauvegardés.</div>\n      <div class="actions"><button id="startJulie" class="primary">Retrouver Julie</button></div>\n    </section></div>\`;`;
            if(!app.includes('JULIE_MIGRATION_V1'))app=changeOnce(app,onboardingMarker,onboardingMarker+julieIntro,'app.js');
            const handler=`  document.querySelector("#startJulie")?.addEventListener("click",async()=>{\n    const button=document.querySelector("#startJulie");\n    if(button)button.disabled=true;\n    try{\n      const julie=(appState.characters||[]).find(x=>x.personId==="JULIE_001");\n      if(!julie)throw new Error("Julie n’est pas encore enregistrée dans cette installation.");\n      appState=await api("/api/partner/select",{method:"POST",body:JSON.stringify({personId:"JULIE_001"})});\n      creatingNew=false; selected=new Set(); render();\n    }catch(error){\n      if(button)button.disabled=false;\n      alert(error?.message||"Impossible d’ouvrir Julie.");\n    }\n  });\n\n`;
            const eventMarker='  document.querySelector("#createPartner")?.addEventListener("click",async()=>{';
            if(!app.includes('document.querySelector("#startJulie")?.addEventListener')){
              app=changeOnce(app,eventMarker,handler+eventMarker,'app.js');
            }
            let readme=read('README.md');
            const newHeader='# JULIE — compagnon virtuel évolutif (anciennement Human Partner)';
            readme=changeOnce(readme,'# Human Partner — architecture locale',newHeader,'README.md');
            const migrationNotice='\n> Migration phase 1 : identité initiale JULIE_001, accueil de Julie et préservation des personnages historiques. Les anciennes bases SQLite conservent volontairement le nom human-partner.sqlite ; ne pas les renommer. Les fonctions 3D/Android ne sont pas encore ajoutées par cette migration.\n';
            if(!readme.includes('Migration phase 1 : identité initiale JULIE_001'))readme=readme.replace(newHeader,newHeader+'\n'+migrationNotice);
            const next=new Map([[pfile,pretty(profiles)],[cfile,pretty(canonical)],['app.js',app],['index.html',index],['README.md',readme]]);
            const changed=Array.from(next.entries()).filter(([file,value])=>read(file)!==value);
            return {changed,profiles,canonical};
          }
          function ensureIgnoredBackup(){
            const ignored=read('.gitignore');
            if(!ignored.split(/\r?\n/).some(x=>x.trim()==='data-backup-*/'))throw new Error('.gitignore ne protège pas data-backup-*/ : arrêt pour éviter un dépôt accidentel.');
          }
          function snapshotSqlite(backupDir){
            const file=path.join(root,'data','human-partner.sqlite');
            if(!fs.existsSync(file))return {status:'absente',database:null};
            const dest=path.join(backupDir,'human-partner.sqlite');
            // VACUUM INTO crée une copie cohérente même si SQLite utilise WAL.
            const { DatabaseSync }=requireSqlite();
            const source=new DatabaseSync(file);
            try{source.exec(`VACUUM INTO '${dest.replaceAll("'","''")}'`);}finally{source.close();}
            const copy=new DatabaseSync(dest);
            try{const result=copy.prepare('PRAGMA integrity_check').get();if(!Object.values(result).includes('ok'))throw new Error('Copie SQLite invalide');}
            finally{copy.close();}
            return {status:'sauvegardée et vérifiée',database:'human-partner.sqlite'};
          }
          // import statique au sein d'ESM ; Node.js >= 22.5
          import { DatabaseSync } from 'node:sqlite';
          function requireSqlite(){return {DatabaseSync};}
          function main(){
            const {changed,profiles}=buildPlan();
            console.log(JSON.stringify({mode:apply?'APPLY':'DRY_RUN',repo:root,modifiedFiles:changed.map(([file])=>file),legacyCharacterRetained:profiles.some(p=>p.personId==='CHLOE_001'),julieCharacterPresent:profiles.some(p=>p.personId===JULIE_ID)},null,2));
            if(!apply||changed.length===0)return;
            ensureIgnoredBackup();
            const nonce=crypto.randomBytes(4).toString('hex');
            const stamp=new Date().toISOString().replace(/[-:]/g,'').replace(/\..+$/,'').replace('T','-');
            const relBackup=`data-backup-julie-${stamp}-${nonce}`;
            const backupDir=path.join(root,relBackup);
            fs.mkdirSync(backupDir,{recursive:false});
            const manifest={created_at:new Date().toISOString(),source:'Listingcase',files:[],database:null};
            try{
              for(const [file] of changed){
                const src=path.join(root,file),dst=path.join(backupDir,file);
                fs.mkdirSync(path.dirname(dst),{recursive:true});fs.copyFileSync(src,dst);
                manifest.files.push({path:file,sha256:sha(fs.readFileSync(src))});
              }
              manifest.database=snapshotSqlite(backupDir);
              fs.writeFileSync(path.join(backupDir,'manifest.json'),pretty(manifest),'utf8');
              for(const [file,next] of changed){
                const target=path.join(root,file),temp=`${target}.julie-tmp-${nonce}`;
                fs.writeFileSync(temp,next,'utf8');fs.renameSync(temp,target);
              }
              buildPlan(); // vérifie la validité et l'idempotence après écriture
              console.log(`JULIE_READY — fichiers migrés; sauvegarde locale ignorée par Git : ${relBackup}`);
            }catch(error){
              for(const file of manifest.files){const saved=path.join(backupDir,file.path);if(fs.existsSync(saved))fs.copyFileSync(saved,path.join(root,file.path));}
              throw new Error(`Migration interrompue, fichiers restaurés depuis ${relBackup} : ${error.message}`);
            }
          }
          try{main();}catch(error){console.error('JULIE_MIGRATION_ABORT:',error.message);process.exitCode=1;}
          __JULIE_KIT_FILE_END_TOOLS_PREPARE-JULIE_MJS__
          cat > tests/prepare-julie.test.mjs <<'__JULIE_KIT_FILE_END_TESTS_PREPARE-JULIE_TEST_MJS__'
          import test from 'node:test';
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import os from 'node:os';
          import path from 'node:path';
          import { spawnSync } from 'node:child_process';
          import { fileURLToPath } from 'node:url';
          import { DatabaseSync } from 'node:sqlite';
          import { JULIE_ID } from '../tools/julie-spec.mjs';

          const tool=path.resolve(path.dirname(fileURLToPath(import.meta.url)),'../tools/prepare-julie.mjs');
          const put=(root,file,text)=>{const p=path.join(root,file);fs.mkdirSync(path.dirname(p),{recursive:true});fs.writeFileSync(p,text);};
          const read=(root,file)=>fs.readFileSync(path.join(root,file),'utf8');
          const backups=root=>fs.readdirSync(root).filter(x=>x.startsWith('data-backup-julie-'));
          const run=(root,...flags)=>spawnSync(process.execPath,[tool,'--repo',root,...flags],{encoding:'utf8'});
          function fixture(){
           const root=fs.mkdtempSync(path.join(os.tmpdir(),'julie-test-'));
           put(root,'.gitignore','data/\n.env\ndata-backup-*/\n');
           put(root,'config/predefined-characters.json',JSON.stringify([{personId:'CHLOE_001',seed:'CHLOE_001_seed_main',name:'Chloé',type:'femme'}],null,2));
           put(root,'config/canonical-personas.json',JSON.stringify({schema_version:1,personas:{CHLOE_001:{relationship_snapshot:'Ancien souvenir'}}},null,2));
           put(root,'index.html','<title>Human Partner</title>');
           const app=`let appState={characters:[]},creatingNew=false,selected=new Set();
           function onboarding(){
            const adding=Boolean(appState.partner&&creatingNew);
           return \`<button id="createPartner" class="primary">Faire connaissance</button>\`;}
           function page(){return \`<div class="brand">Human Partner</div><h2>Chloé canonique</h2>Ce profil fixe la continuité de Chloé avec Amaury. L’identité vivante peut évoluer autour de ce socle sans le remplacer.\`;}
           const api=async()=>({});const render=()=>{};const esc=String;
           function bind(){
            document.querySelector("#createPartner")?.addEventListener("click",async()=>{});
          }
           `;
           put(root,'app.js',app);
           put(root,'README.md','# Human Partner — architecture locale\n\nContenu historique.');
           const dbPath=path.join(root,'data','human-partner.sqlite');fs.mkdirSync(path.dirname(dbPath),{recursive:true});
           const db=new DatabaseSync(dbPath);db.exec("CREATE TABLE evidence(value TEXT); INSERT INTO evidence(value) VALUES('avant Julie')");db.close();
           return root;
          }
          test('prévisualisation sans mutation',()=>{
           const root=fixture();try{const before=read(root,'app.js');const result=run(root);assert.equal(result.status,0,result.stderr);assert.match(result.stdout,/DRY_RUN/);assert.equal(read(root,'app.js'),before);assert.deepEqual(backups(root),[]);}finally{fs.rmSync(root,{recursive:true,force:true});}
          });
          test('migration avec sauvegarde cohérente et personnages préservés',()=>{
           const root=fixture();try{
           const result=run(root,'--apply');assert.equal(result.status,0,result.stderr+'\n'+result.stdout);
           const profiles=JSON.parse(read(root,'config/predefined-characters.json'));
           assert.equal(profiles.length,2);assert.ok(profiles.some(p=>p.personId==='CHLOE_001'));
           const julie=profiles.find(p=>p.personId===JULIE_ID);
           assert.equal(julie.name,'Julie');assert.equal(julie.ageYearsAtLaunch,22);
           assert.equal(julie.visualIdentity.heightMeters,1.75);
           const personas=JSON.parse(read(root,'config/canonical-personas.json')).personas;
           assert.ok(personas.CHLOE_001);assert.ok(personas[JULIE_ID]);assert.equal(Object.hasOwn(personas[JULIE_ID],'relationship_snapshot'),false);
           assert.match(read(root,'app.js'),/JULIE_MIGRATION_V1/);
           assert.match(read(root,'index.html'),/JULIE/);
           const bs=backups(root);assert.equal(bs.length,1);
           const db=new DatabaseSync(path.join(root,bs[0],'human-partner.sqlite'));
           try{assert.equal(db.prepare('SELECT value FROM evidence').get().value,'avant Julie');assert.deepEqual(Object.values(db.prepare('PRAGMA integrity_check').get()),['ok']);}finally{db.close();}
           const check=spawnSync(process.execPath,['--check',path.join(root,'app.js')],{encoding:'utf8'});
           assert.equal(check.status,0,check.stderr);
           }finally{fs.rmSync(root,{recursive:true,force:true});}
          });
          test('relance idempotente',()=>{
           const root=fixture();try{assert.equal(run(root,'--apply').status,0);const old=read(root,'config/predefined-characters.json');const again=run(root,'--apply');assert.equal(again.status,0,again.stderr);assert.match(again.stdout,/"modifiedFiles": \[\]/);assert.equal(read(root,'config/predefined-characters.json'),old);assert.equal(backups(root).length,1);}finally{fs.rmSync(root,{recursive:true,force:true});}
          });
          test('refus si JULIE_001 existe avec une autre identité',()=>{
           const root=fixture();try{const p=JSON.parse(read(root,'config/predefined-characters.json'));p.push({personId:JULIE_ID,seed:'ancienne-vie',name:'Julie'});put(root,'config/predefined-characters.json',JSON.stringify(p));const before=read(root,'config/predefined-characters.json');const result=run(root,'--apply');assert.notEqual(result.status,0);assert.match(result.stderr,/validation humaine nécessaire/);assert.equal(read(root,'config/predefined-characters.json'),before);assert.equal(backups(root).length,0);}finally{fs.rmSync(root,{recursive:true,force:true});}
          });
          test('arrêt avant modification si l’interface ne correspond pas',()=>{
           const root=fixture();try{put(root,'app.js','interface personnalisée');const result=run(root,'--apply');assert.notEqual(result.status,0);assert.equal(backups(root).length,0);assert.match(read(root,'index.html'),/Human Partner/);}finally{fs.rmSync(root,{recursive:true,force:true});}
          });
          test('les données originales restent lisibles après migration',()=>{
           const root=fixture();try{
            assert.equal(run(root,'--apply').status,0);
            const db=new DatabaseSync(path.join(root,'data','human-partner.sqlite'));
            try{assert.equal(db.prepare('SELECT value FROM evidence').get().value,'avant Julie');}
            finally{db.close();}
           }finally{fs.rmSync(root,{recursive:true,force:true});}
          });
          test('refuse de créer une sauvegarde non ignorée par Git',()=>{
           const root=fixture();try{
            put(root,'.gitignore','node_modules/\n');
            const result=run(root,'--apply');assert.notEqual(result.status,0);
            assert.match(result.stderr,/ne protège pas data-backup/);
            assert.equal(backups(root).length,0);
            assert.match(read(root,'index.html'),/Human Partner/);
           }finally{fs.rmSync(root,{recursive:true,force:true});}
          });
          __JULIE_KIT_FILE_END_TESTS_PREPARE-JULIE_TEST_MJS__
          cat > docs/MIGRATION_JULIE.md <<'__JULIE_KIT_FILE_END_DOCS_MIGRATION_JULIE_MD__'
          # JULIE — Migration non destructive de Listingcase

          ## État contrôlé le 09/10/2026

          - Source : `amaurygiboudot-arch/Listingcase`, branche `main`.
          - HEAD observé : `2dd32af8cc90d772feeff1242b8ec871902efb49`.
          - Baseline : Node.js 22+, SQLite `data/human-partner.sqlite`, interface web, personnages préconfigurés, mémoire vivante, tests `npm run check`, build Android existant **non 3D**.
          - Statut d'accès : lecture GitHub disponible ; écriture via l'intégration refusée (HTTP 403). PC Remote Desktop « EDUCTOR » hors ligne.
          - Aucune modification de GitHub, du PC, de la base de production, ni d'une application Android n'a été faite.

          ## Procédure dès qu'un accès d'écriture ou un poste est disponible

          1. Faire une copie locale du dépôt et préserver l'historique de Git. Sur une machine disposant de Git :
             `git clone https://github.com/amaurygiboudot-arch/Listingcase.git` puis `cd Listingcase`.
          2. Vérifier la branche `main`, que la copie est propre, et créer les branches distinctes :
             `git branch backup/human-partner-2026-10-09` puis `git switch -c feat/julie-migration-2026-10-09`.
          3. Copier `tools/julie-spec.mjs` et `tools/prepare-julie.mjs` dans le sous-dossier `tools/` du dépôt.
          4. Tester sans modifier : `node tools/prepare-julie.mjs`.
          5. Appliquer localement : `node tools/prepare-julie.mjs --apply`.
             - Sauvegarde des fichiers originaux dans `data-backup-julie-*` (ignoré par Git).
             - Sauvegarde SQLite cohérente et vérifiée par `PRAGMA integrity_check` si `data/human-partner.sqlite` existe.
             - Ajout de `JULIE_001` **sans retirer** `CHLOE_001` ni aucune session.
             - Interface d'accueil renommée, bouton « Retrouver Julie ».
          6. Vérifier `npm run check` et `npm start` avec un **répertoire DATA_DIR temporaire** avant tout usage réel.
          7. Vérifier en UI : Julie existe après lancement, a 22 ans et l'apparence prévue, aucun souvenir commun inventé, sélection de Julie possible, identité stable après redémarrage, ancienne base intacte.
          8. Comparer les modifications `git diff`, créer une PR ; ne fusionner qu'après CI verte et vérification manuelle de sauvegarde/restauration.

          ## Décisions délibérées

          - Ne pas renommer immédiatement `human-partner.sqlite` : cela ferait paraître la mémoire disparue.
          - Ne pas supprimer les personnages, conversations, visualisations ou fichiers antérieurs pendant cette première étape.
          - Ne pas présenter comme implémentés l'autonomie complète, l'avatar Godot, le corps 3D anatomique ou l'APK 3D.
          - Ne pas activer automatiquement un autre personnage si une session existante est ouverte ; une bascule explicite et contrôlée reste nécessaire.
          - Les profils historiques peuvent être archivés après validation d'une sauvegarde/restauration, jamais par suppression silencieuse.
          - Le dépôt est actuellement **public**. Ne pas y déposer de mots de passe, clés, conversations, journaux, souvenirs réels ou sauvegardes personnelles.
          - Aucune dépense ni déploiement payant ne doit être engagé.

          ## Risques de l'ancienne application à traiter ensuite

          1. Route de suppression de personnage pouvant effacer sessions et identité : ajouter une double confirmation et une sauvegarde vérifiée pour JULIE_001.
          2. Multi-utilisateur et chiffrement applicatif non implémentés : **pas de publication publique**.
          3. `startNewCharacter` vide les tables actives après snapshot ; tester précisément restauration, fichiers médias et rétablissement de personnages.
          4. Les fichiers de référence et la documentation mentionnent Chloé et Human Partner ; les retirer seulement quand les anciennes données auront été archivées et les comportements testés.
          5. Connexion au moteur Godot et export Android 3D : travail ultérieur, indépendant de la migration d'identité.
